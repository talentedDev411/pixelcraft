<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Studio – Image Editor</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <div class="context-menu" id="contextMenu">
        <div class="menu-item" data-action="bringToFront">⬆️ Bring to Front</div>
        <div class="menu-item" data-action="sendToBack">⬇️ Send to Back</div>
        <div class="menu-item" data-action="duplicate">📋 Duplicate</div>
        <div class="menu-item" data-action="delete">🗑️ Delete</div>
        <div class="menu-item" data-action="scaleToCanvas" style="display:none;">📐 Scale to Canvas</div>
        <div class="menu-item" data-action="fitModeToggle" id="fitModeMenuItem" style="display:none;">🔄 Fit Mode: Fill</div>
    </div>

    <div class="top-bar">
        <div class="brand"><span>✨</span> Design Studio</div>
        <div class="aspect-ratios" id="aspectRatios">
            <button class="aspect-btn active" data-ratio="1:1">1:1</button>
            <button class="aspect-btn" data-ratio="4:5">4:5</button>
            <button class="aspect-btn" data-ratio="9:16">9:16</button>
            <button class="aspect-btn" data-ratio="16:9">16:9</button>
            <button class="aspect-btn" data-ratio="2:3">2:3</button>
        </div>
        <div class="actions">
            <button class="btn btn-outline" id="clearCanvasBtn">🗑️ Clear</button>
            <button class="btn btn-primary" id="exportBtn">📤 Export</button>
        </div>
    </div>

    <div class="editor-layout">
        <div class="toolbox">
            <div class="tool" id="addTextTool"><span class="tool-icon">🔤</span> Text</div>
            <div class="tool" id="addImageTool">
                <label><span class="tool-icon">🖼️</span> Image <input type="file" id="imageUploadInput" accept="image/*" /></label>
            </div>
            <div class="tool" id="bgColorTool">
                <span class="tool-icon">🎨</span> BG <input type="color" id="canvasBgColor" value="#ffffff" />
            </div>
        </div>

        <div class="canvas-area" id="canvasArea">
            <div class="canvas-wrapper" id="canvasWrapper">
                <div class="canvas" id="designCanvas"></div>
            </div>
        </div>

        <div class="properties-panel" id="propertiesPanel">
            <h3>Properties</h3>
            <div id="noSelection" class="empty-state">Select an element to edit</div>
            <div id="positionProperties" style="display:none;">
                <div class="property-group">
                    <label>Position &amp; Size (px)</label>
                    <div class="position-grid">
                        <div class="position-field">
                            <label>X</label>
                            <input type="number" id="positionXInput" step="1" />
                        </div>
                        <div class="position-field">
                            <label>Y</label>
                            <input type="number" id="positionYInput" step="1" />
                        </div>
                        <div class="position-field">
                            <label>W</label>
                            <input type="number" id="sizeWidthInput" step="1" min="20" />
                        </div>
                        <div class="position-field">
                            <label>H</label>
                            <input type="number" id="sizeHeightInput" step="1" min="20" />
                        </div>
                    </div>
                </div>
            </div>
            <div id="textProperties" style="display:none;">
                <div class="property-group">
                    <label>Text Content</label>
                    <input type="text" id="textContentInput" placeholder="Edit text" />
                </div>
                <div class="property-group">
                    <label>Font Size</label>
                    <input type="number" id="fontSizeInput" min="8" max="120" value="24" />
                </div>
                <div class="property-group">
                    <label>Font Weight</label>
                    <select id="fontWeightInput">
                        <option value="400">Normal</option>
                        <option value="500">Medium</option>
                        <option value="600">Semi-Bold</option>
                        <option value="700">Bold</option>
                        <option value="800">Extra Bold</option>
                    </select>
                </div>
                <div class="property-group">
                    <label>Text Color</label>
                    <div class="color-row"><input type="color" id="textColorInput" value="#000000" /></div>
                </div>
                <div class="property-group">
                    <label>Background Color</label>
                    <div class="color-row"><input type="color" id="textBgColorInput" value="#ffffff00" /></div>
                </div>
                <div class="property-group">
                    <label>Text Shadow</label>
                    <input type="text" id="textShadowInput" placeholder="0px 2px 4px rgba(0,0,0,0.3)" />
                </div>
                <button class="btn-sm" id="deleteElementBtn">🗑️ Delete Element</button>
            </div>
            <div id="imageProperties" style="display:none;">
                <div class="property-group">
                    <label>Swap Image</label>
                    <input type="file" id="swapImageInput" accept="image/*" />
                </div>
                <button class="btn-sm" id="deleteImageBtn">🗑️ Delete Element</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
